<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml" style="padding: 8px 12px; gap: 10px">
  <groupbox>
    <label><html:h2>sync2kindle</html:h2></label>
    <hbox align="center">
      <label value="Path to s2k binary" style="width: 170px"/>
      <html:input type="text" style="flex: 1" preference="extensions.zoterokindle.s2kPath"/>
      <button id="zk-pick-s2k" label="Browse…"/>
      <button id="zk-install-s2k" label="Download latest"/>
    </hbox>
    <description style="opacity: .7">
      Leave the path empty to have the plugin download s2k from the sync2kindle releases on first use. macOS also needs libmtp (brew install libmtp).
    </description>
    <hbox align="center">
      <label value="Mirror folder" style="width: 170px"/>
      <html:input type="text" style="flex: 1" preference="extensions.zoterokindle.mirrorDir"/>
      <button id="zk-pick-mirror" label="Browse…"/>
    </hbox>
    <description style="opacity: .7">
      PDFs are copied here as &lt;Library&gt;/&lt;Author Year - Title&gt;.pdf and synced from here. Zotero's own storage is never touched by the device sync.
    </description>
    <hbox align="center">
      <label value="Folder on Kindle" style="width: 170px"/>
      <html:input type="text" style="flex: 1" preference="extensions.zoterokindle.target"/>
    </hbox>
  </groupbox>
  <groupbox>
    <label><html:h2>What to sync</html:h2></label>
    <hbox align="center">
      <label value="Libraries (comma separated, blank = all)" style="width: 260px"/>
      <html:input type="text" style="flex: 1" preference="extensions.zoterokindle.libraries"/>
    </hbox>
    <checkbox label="Ignore deletions made on the Kindle (one-way sync)" preference="extensions.zoterokindle.ignoreDeviceRemovals"/>
  </groupbox>
  <groupbox>
    <label><html:h2>Folders on the Kindle</html:h2></label>
    <radiogroup id="zk-layout" preference="extensions.zoterokindle.layout">
      <radio value="collections" label="Mirror the Zotero collection tree (Library / Collection / Subcollection)"/>
      <radio value="library" label="One folder per library"/>
    </radiogroup>
    <checkbox label="A paper in several collections is copied into each of them" preference="extensions.zoterokindle.allCollections"/>
    <hbox align="center">
      <label value="Collection tag in the file name" style="width: 260px"/>
      <menulist preference="extensions.zoterokindle.nameTag">
        <menupopup>
          <menuitem value="leaf" label="[Collection] title  (innermost collection)"/>
          <menuitem value="path" label="[Parent / Collection] title  (full path)"/>
          <menuitem value="none" label="No tag"/>
        </menupopup>
      </menulist>
    </hbox>
    <description style="opacity: .7">
      The Kindle shows documents as a flat list and ignores folders. The tag lets you group papers by collection when sorting by title, and find a whole collection by searching for its name.
    </description>
    <description style="opacity: .7">
      Papers in no collection go to an "Unfiled" folder. Changing the layout moves every paper on the Kindle on the next sync.
    </description>
  </groupbox>
  <groupbox>
    <label><html:h2>Background sync</html:h2></label>
    <checkbox label="Sync automatically while Zotero is running" preference="extensions.zoterokindle.autoSync"/>
    <hbox align="center">
      <label value="Check for the Kindle every (minutes)" style="width: 260px"/>
      <html:input type="number" min="1" max="720" style="width: 6em" preference="extensions.zoterokindle.autoSyncMinutes"/>
    </hbox>
    <description style="opacity: .7">
      Nothing is shown while no Kindle is connected. When a connected Kindle receives or loses papers, a short summary pops up.
    </description>
  </groupbox>
  <groupbox>
    <label><html:h2>Tags written back to Zotero</html:h2></label>
    <hbox align="center">
      <label value="Tag when a PDF is on the Kindle" style="width: 260px"/>
      <html:input type="text" style="flex: 1" preference="extensions.zoterokindle.syncedTag"/>
    </hbox>
    <hbox align="center">
      <label value="Tag when it was deleted on the Kindle" style="width: 260px"/>
      <html:input type="text" style="flex: 1" preference="extensions.zoterokindle.removedTag"/>
    </hbox>
    <description style="opacity: .7">
      An item tagged as removed is not sent again until you delete that tag.
    </description>
  </groupbox>
</vbox>
